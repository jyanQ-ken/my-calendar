<!DOCTYPE html>
<html lang="ja" data-view="calendar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f2f2f7">
  <!-- iPhone・Androidの「ホーム画面に追加」で、アプリのように見せる設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My Calendar">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>My Calendar</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body data-mode="write">

  <div class="wrap">
    <header class="app-header">
      <div class="month-nav">
        <button id="prevBtn" class="nav-btn" type="button">＜ 前の月</button>
        <h1 id="monthTitle" class="month-title" aria-live="polite"></h1>
        <button id="nextBtn" class="nav-btn" type="button">次の月 ＞</button>
      </div>
      <!-- 1段にまとめた操作: 表示のしかた(月表示 / 一覧表示) と、今日・書き出し -->
      <div class="header-row">
        <div class="view-switch" role="group" aria-label="表示のしかた">
          <button class="view-btn" type="button" data-view="calendar" aria-pressed="true">月表示</button>
          <button class="view-btn" type="button" data-view="list" aria-pressed="false">一覧表示</button>
          <button class="view-btn" type="button" data-view="memo" aria-pressed="false">ノート</button>
        </div>
        <div class="sub-nav">
          <button id="todayBtn" class="sub-btn" type="button">今日</button>
          <button id="exportBtn" class="sub-btn" type="button">書き出し</button>
        </div>
      </div>
    </header>

    <main>
      <div id="weekdays" class="weekdays" aria-hidden="true">
        <div class="w-sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="w-sat">土</div>
      </div>
      <!-- 月表示(画面に固定。スクロールしない) -->
      <div id="grid" class="grid"></div>
      <!-- 一覧表示(1日〜月末が上から順に並ぶ。こちらはスクロールできる) -->
      <div id="dayList" class="day-list" hidden></div>

      <!-- ノート(日付に関係なく、自由に書ける。シートは画面の下から切り替え・増やせる) -->
      <section id="memoView" class="memo-view" hidden aria-label="ノート">
        <div class="sheet-head">
          <h2 id="sheetTitle" class="sheet-title"></h2>
          <button id="sheetMenuBtn" class="sheet-menu-btn" type="button">シートの操作 ▾</button>
        </div>
        <div class="memo-paper">
          <label for="sheetText" class="visually-hidden">ノートの内容</label>
          <textarea id="sheetText" class="sheet-text" placeholder="ここに自由に書けます。日付に関係なく、ずっと残ります。"></textarea>
          <div id="sheetRows" class="sheet-rows" hidden></div>
          <!-- 「済みを消す」ボタン。チェック付きのとき、リストの一番下(「＋ 行を追加」の隣)に移して出す -->
          <button id="sheetClearDone" class="btn" type="button" hidden>済みを消す</button>
        </div>
      </section>
    </main>
  </div>

  <!-- 画面下の操作バー: 「予定メモ」か「休み・印」を選びます -->
  <footer class="toolbar">
    <div class="toolbar-inner">
      <p id="modeHint" class="mode-hint" aria-live="polite"></p>
      <div id="modeButtons" class="mode-buttons" role="group" aria-label="操作を選ぶ"></div>
    </div>
  </footer>

  <!-- ノートの画面の下: シートのタブ(Excelのシートのように、下から切り替え・増やせる) -->
  <nav id="sheetBar" class="sheet-bar" aria-label="シート">
    <button id="sheetAdd" class="sheet-add" type="button" aria-label="シートを増やす">＋</button>
    <div id="sheetTabs" class="sheet-tabs" role="tablist"></div>
  </nav>

  <!-- 予定メモを書く画面 -->
  <div id="memoOverlay" class="overlay" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="memoTitle" tabindex="-1">
      <h2 id="memoTitle"></h2>
      <p id="memoSub" class="sheet-sub" hidden></p>
      <label for="memoText" class="visually-hidden">この日の予定メモ</label>
      <textarea id="memoText" placeholder="ここに予定メモを書きます"></textarea>
      <p class="note">書いた予定メモは、自動で保存されます。</p>
      <div class="sheet-buttons">
        <button id="memoClear" class="btn btn-danger" type="button">この日を空にする</button>
        <button id="memoClose" class="btn btn-primary" type="button">閉じる</button>
      </div>
    </section>
  </div>

  <!-- 書き出し画面 -->
  <div id="exportOverlay" class="overlay" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="exportTitle" tabindex="-1">
      <h2 id="exportTitle">書き出し</h2>
      <p class="note">チェックを付けた日だけを、一覧にします。祝日の名前は、自動で入ります。</p>

      <fieldset class="field">
        <legend>期間</legend>
        <div class="date-row">
          <input type="date" id="exFrom" min="2000-01-01" max="2099-12-31">
          <span>から</span>
          <input type="date" id="exTo" min="2000-01-01" max="2099-12-31">
          <span>まで</span>
        </div>
      </fieldset>

      <fieldset class="field">
        <legend>出したい日</legend>
        <div id="exChecks" class="checks"></div>
      </fieldset>

      <label class="check check-text"><input type="checkbox" id="exText" checked> 予定メモも一緒に出す</label>

      <p id="exMessage" class="ex-message" aria-live="polite"></p>
      <label for="exResult" class="visually-hidden">書き出した一覧</label>
      <textarea id="exResult" readonly></textarea>

      <div class="sheet-buttons">
        <button id="exCopy" class="btn btn-primary" type="button">コピーする</button>
        <button id="exClose" class="btn" type="button">閉じる</button>
      </div>
      <p class="note">「コピーする」のあと、メモ帳やExcelなどに貼り付けられます。</p>

      <!-- 大事な注意書き(2行だけ) -->
      <div class="fineprint">
        <p>祝日は、2026年11月時点の祝日の決まりで計算しています。国が決まりを変えると、実際の祝日とずれることがあります。</p>
        <p>書いた内容は、この機械の中だけに保存されます。ブラウザのデータを消すと、内容も消えます。大事な内容は、ここで書き出して残してください。(ノートは、シートの操作の「内容をコピー」で残せます)</p>
      </div>
    </section>
  </div>

  <!-- シートの操作メニュー(シートの名前の横の「シートの操作」を押すと開く) -->
  <div id="sheetMenu" class="overlay" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="menuTitle" tabindex="-1">
      <h2 id="menuTitle">シートの操作</h2>
      <div class="menu-list">
        <button id="menuRename" class="menu-item" type="button">
          <span class="menu-name">名前を変える</span>
          <span class="menu-note">このシートの名前を、付け直します</span>
        </button>
        <button id="menuChecklist" class="menu-item" type="button">
          <span class="menu-name">チェックを付けられる形: <b id="menuChecklistState">オフ</b></span>
          <span class="menu-note">やること用。1行ごとに、チェックの四角が付きます。押すと切り替わります</span>
        </button>
        <button id="menuCopy" class="menu-item" type="button">
          <span class="menu-name">内容をコピー</span>
          <span class="menu-note">このシートの文章を、ほかのアプリに貼り付けられます</span>
        </button>
        <button id="menuDelete" class="menu-item menu-danger" type="button">
          <span class="menu-name">このシートを消す</span>
          <span class="menu-note">中身も消えます</span>
        </button>
      </div>
      <div class="sheet-buttons">
        <button id="menuClose" class="btn" type="button">閉じる</button>
      </div>
    </section>
  </div>

  <!-- シートの名前を入れる小さな画面(シートを増やすとき・名前を変えるとき) -->
  <div id="nameOverlay" class="overlay" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="nameTitle" tabindex="-1">
      <h2 id="nameTitle">シートの名前</h2>
      <label for="nameInput" class="visually-hidden">シートの名前</label>
      <input id="nameInput" class="text-input" type="text" maxlength="20" autocomplete="off">
      <div class="sheet-buttons">
        <button id="nameCancel" class="btn" type="button">やめる</button>
        <button id="nameOk" class="btn btn-primary" type="button">決定</button>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <!-- 祝日の計算 → 画面の動き の順に読み込みます -->
  <script src="holidays.js?v=1"></script>
  <script src="script.js?v=6"></script>
</body>
</html>
