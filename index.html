<!DOCTYPE html>
<html lang="ja" data-view="calendar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f2f2f7">
  <!-- iPhone・Androidの「ホーム画面に追加」で、アプリのように見せる設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My Calendar">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>My Calendar</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body data-mode="write">

  <div class="wrap">
    <header class="app-header">
      <div class="month-nav">
        <button id="prevBtn" class="nav-btn" type="button">＜ 前の月</button>
        <h1 id="monthTitle" class="month-title" aria-live="polite"></h1>
        <button id="nextBtn" class="nav-btn" type="button">次の月 ＞</button>
      </div>
      <!-- 1段にまとめた操作: 表示のしかた(月表示 / 一覧表示) と、今日・書き出し -->
      <div class="header-row">
        <div class="view-switch" role="group" aria-label="表示のしかた">
          <button class="view-btn" type="button" data-view="calendar" aria-pressed="true">月表示</button>
          <button class="view-btn" type="button" data-view="list" aria-pressed="false">一覧表示</button>
        </div>
        <div class="sub-nav">
          <button id="todayBtn" class="sub-btn" type="button">今日</button>
          <button id="exportBtn" class="sub-btn" type="button">書き出し</button>
        </div>
      </div>
    </header>

    <main>
      <div id="weekdays" class="weekdays" aria-hidden="true">
        <div class="w-sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="w-sat">土</div>
      </div>
      <!-- 月表示(画面に固定。スクロールしない) -->
      <div id="grid" class="grid"></div>
      <!-- 一覧表示(1日〜月末が上から順に並ぶ。こちらはスクロールできる) -->
      <div id="dayList" class="day-list" hidden></div>
    </main>
  </div>

  <!-- 画面下の操作バー: 「予定メモ」か「休み・印」を選びます -->
  <footer class="toolbar">
    <div class="toolbar-inner">
      <p id="modeHint" class="mode-hint" aria-live="polite"></p>
      <div id="modeButtons" class="mode-buttons" role="group" aria-label="操作を選ぶ"></div>
    </div>
  </footer>

  <!-- 予定メモを書く画面 -->
  <div id="memoOverlay" class="overlay" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="memoTitle" tabindex="-1">
      <h2 id="memoTitle"></h2>
      <p id="memoSub" class="sheet-sub" hidden></p>
      <label for="memoText" class="visually-hidden">この日の予定メモ</label>
      <textarea id="memoText" placeholder="ここに予定メモを書きます"></textarea>
      <p class="note">書いた予定メモは、自動で保存されます。</p>
      <div class="sheet-buttons">
        <button id="memoClear" class="btn btn-danger" type="button">この日を空にする</button>
        <button id="memoClose" class="btn btn-primary" type="button">閉じる</button>
      </div>
    </section>
  </div>

  <!-- 書き出し画面 -->
  <div id="exportOverlay" class="overlay" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="exportTitle" tabindex="-1">
      <h2 id="exportTitle">書き出し</h2>
      <p class="note">チェックを付けた日だけを、一覧にします。祝日の名前は、自動で入ります。</p>

      <fieldset class="field">
        <legend>期間</legend>
        <div class="date-row">
          <input type="date" id="exFrom" min="2000-01-01" max="2099-12-31">
          <span>から</span>
          <input type="date" id="exTo" min="2000-01-01" max="2099-12-31">
          <span>まで</span>
        </div>
      </fieldset>

      <fieldset class="field">
        <legend>出したい日</legend>
        <div id="exChecks" class="checks"></div>
      </fieldset>

      <label class="check check-text"><input type="checkbox" id="exText" checked> 予定メモも一緒に出す</label>

      <p id="exMessage" class="ex-message" aria-live="polite"></p>
      <label for="exResult" class="visually-hidden">書き出した一覧</label>
      <textarea id="exResult" readonly></textarea>

      <div class="sheet-buttons">
        <button id="exCopy" class="btn btn-primary" type="button">コピーする</button>
        <button id="exClose" class="btn" type="button">閉じる</button>
      </div>
      <p class="note">「コピーする」のあと、メモ帳やExcelなどに貼り付けられます。</p>

      <!-- 大事な注意書き(2行だけ) -->
      <div class="fineprint">
        <p>祝日は、2026年11月時点の祝日の決まりで計算しています。国が決まりを変えると、実際の祝日とずれることがあります。</p>
        <p>書いた内容は、この機械の中だけに保存されます。ブラウザのデータを消すと、内容も消えます。大事な内容は、ここで書き出して残してください。</p>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <!-- 祝日の計算 → 画面の動き の順に読み込みます -->
  <script src="holidays.js?v=1"></script>
  <script src="script.js?v=3"></script>
</body>
</html>
